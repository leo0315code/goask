name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go 后端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 静态检查
        run: go vet ./...
      - name: 单元测试
        run: go test ./... -count=1
      - name: 编译
        run: go build ./...

  frontend:
    name: Vue 前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: web
      - name: 构建
        run: npm run build
        working-directory: web
